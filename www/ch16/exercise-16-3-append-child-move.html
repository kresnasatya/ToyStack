<!DOCTYPE html>
<html>
<head>
  <title>Chapter 16 — appendChild moves a node</title>
  <style>
    body { font-family: monospace; font-size: 16px; margin: 12px; }
    h1 { font-size: 20px; }
    #source { width: 420px; border: 1px solid black; padding: 8px; margin-bottom: 8px; }
    #target { width: 420px; border: 1px solid black; padding: 8px; background-color: lightblue; }
  </style>
</head>
<body>

<h1>Chapter 16: appendChild moves a child</h1>

<p>After 60 animation frames the target adopts the source's first paragraph.
The source must shrink, the target must grow, and the paragraph must appear
exactly once.</p>

<div id="source">
  <p>one, moved to the target</p>
  <p>two, stays in the source</p>
</div>

<div id="target"><p>the target's own child</p></div>

<pre id="out">before appendChild</pre>

<script>
  var framesLeft = 60;

  function tick() {
    framesLeft = framesLeft - 1;
    if (framesLeft > 0) {
      requestAnimationFrame(tick);
      return;
    }

    var source = document.getElementById("source");
    var target = document.getElementById("target");

    target.appendChild(source.children[0]);

    document.getElementById("out").textContent =
      "source children=" + source.children.length +
      "\ntarget children=" + target.children.length;
  }

  requestAnimationFrame(tick);
</script>

</body>
</html>
