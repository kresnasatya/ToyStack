<!doctype html>
<html dir="rtl">
<head>
    <meta charset="utf-8">
    <title>direction: rtl</title>
    <style>
        body { font-size: 20px; }
    </style>
</head>
<body>
    <h1>Right to left</h1>
    <p>This paragraph should start at the right edge and flow toward the left.</p>
    <div dir="ltr">
        <p>Nested dir="ltr" flips this block back to left to right.</p>
    </div>
</body>
</html>
